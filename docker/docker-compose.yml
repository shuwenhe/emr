version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: hospital-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hospital}
      MYSQL_DATABASE: ${MYSQL_DB:-hospital}
      MYSQL_USER: ${MYSQL_USER:-hospital}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hospital}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: hospital-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-hospital}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hospital}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-hospital}
    ports:
      - "${CLICKHOUSE_PORT:-9000}:9000"
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/init_clickhouse.sh:/docker-entrypoint-initdb.d/init_clickhouse.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8123/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-backend
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      report-file-service:
        condition: service_started
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=${MYSQL_DB:-hospital}
      - MYSQL_USER=${MYSQL_USER:-hospital}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hospital}
      - ENABLE_GO_REPORT_PROXY=${ENABLE_GO_REPORT_PROXY:-false}
      - GO_REPORT_SERVICE_URL=${GO_REPORT_SERVICE_URL:-http://report-file-service:8088}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports
      - ./ingestion:/app:delegated  # 开发时热重载
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hospital-network
    restart: unless-stopped

  report-file-service:
    build:
      context: ./go-services/report-file-service
      dockerfile: Dockerfile
    container_name: hospital-report-file-service
    environment:
      - RFS_ADDR=:8088
      - RFS_REPORTS_DIR=/app/reports
      - RFS_CACHE_TTL_SECONDS=300
    ports:
      - "${REPORT_FILE_SERVICE_PORT:-8088}:8088"
    volumes:
      - ./reports:/app/reports
    networks:
      - hospital-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    container_name: hospital-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    volumes:
      - ./web:/app:delegated  # 开发时热重载
      - /app/node_modules
      - /app/.next
    networks:
      - hospital-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hospital-nginx
    depends_on:
      - web
      - backend
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hospital-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  clickhouse_data:
    driver: local

networks:
  hospital-network:
    driver: bridge
