version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: hospital-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hospital}
      MYSQL_DATABASE: ${MYSQL_DB:-hospital}
      MYSQL_USER: ${MYSQL_USER:-hospital}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hospital}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=${MYSQL_DB:-hospital}
      - MYSQL_USER=${MYSQL_USER:-hospital}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hospital}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./storage/reports:/app/storage/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hospital-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_SELF_REGISTER_BASE_URL=${NEXT_PUBLIC_SELF_REGISTER_BASE_URL:-}
    container_name: hospital-web
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - NEXT_PUBLIC_SELF_REGISTER_BASE_URL=${NEXT_PUBLIC_SELF_REGISTER_BASE_URL:-}
    networks:
      - hospital-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hospital-nginx
    depends_on:
      - web
      - backend
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hospital-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  hospital-network:
    driver: bridge
